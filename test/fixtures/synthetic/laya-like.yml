name: Release

# Trigger switched to the family standard.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (pack and report, publish nothing)"
        type: boolean
        default: true
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - uses: changesets/action@v1
        with:
          publish: npm run release
