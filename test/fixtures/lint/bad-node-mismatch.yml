name: Publish to npm

# Publish model: main is the release branch. A push to main publishes only if
# package.json's version isn't on npm yet (otherwise a clean no-op), then tags
# v<version> and creates a GitHub Release. See johnhenry/workflows' README.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write # tag + GitHub Release by-product of npm-publish.yml
      id-token: write # npm provenance
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "24" # must equal package.json engines.node major
      gate-commands: npm test
      # install-command: npm install   # no committed lockfile
      # node-cache: ""                  # no committed lockfile
      # working-directory: packages/x   # package lives in a subdirectory
      # create-release: false           # skip the tag + GitHub Release
      # release-notes: none             # instead of auto-generated notes
    secrets: inherit
