name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Publish packages
        # Dependency order, not alphabetical. `npm publish --workspaces`
        # iterates alphabetically -- consensus before core -- and every
        # dependent now requires `@johnhenry/raijin-core@^0.0.1`, which does
        # not exist on the registry until core itself is published. Publishing
        # out of order fails the dependent, or worse, resolves an older core.
        # `raijin-test-harness` is private and npm skips it on its own.
        #
        # Guarded per-package: this workflow can run on every workflow_dispatch
        # regardless of whether any package's version actually changed (e.g. to
        # verify the token still authenticates), so skip anything whose
        # name@version is already on the registry instead of letting `npm
        # publish` fail loudly with "cannot publish over previously published
        # version" for the common, expected case of nothing new to ship.
        run: |
          publish_if_new() {
            local workspace="$1" dir="$2"
            local name version
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip: $name@$version already published"
            else
              npm publish -w "$workspace" --access public --provenance
            fi
          }
          publish_if_new @johnhenry/raijin-core      packages/core
          publish_if_new @johnhenry/raijin-consensus packages/consensus
          publish_if_new @johnhenry/raijin-mempool   packages/mempool
          publish_if_new @johnhenry/raijin-da        packages/da
          publish_if_new @johnhenry/raijin-sdk       packages/sdk
          publish_if_new @johnhenry/raijin-validator packages/validator
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
