name: Publish to npm

# Publishes from main, mirroring johnhenry/math's publish.yml but for a
# single-package repo: no workspace loop, no JSR job (this package is
# npm-only for now).
#
# Bump `version` in package.json and merge to main — or dispatch manually. Publishing is skipped when the version is already on
# npm, so re-running a release or dispatching twice is safe.
#
# Requires the NPM_TOKEN repository secret.

# Publish model: main is the release branch. A push to main publishes only if
# package.json's version isn't on npm yet (otherwise a clean no-op), then tags
# v<version> and creates a GitHub Release. See johnhenry/workflows' README.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # tag + GitHub Release by-product
  id-token: write # npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # `npm test` already chains typecheck (see package.json), so this is
      # the full verification surface this repo has.
      - run: npm test

      - run: npm run build

      - name: No NPM_TOKEN — skipping publish
        if: env.NPM_TOKEN == ''
        run: |
          echo "::notice title=Publish skipped::NPM_TOKEN is not configured; nothing was published."

      - name: Check whether this version is new on npm
        id: release-probe
        # Feeds the tag + GitHub Release step below: only a run that actually
        # publishes a new version should create the release.
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # Idempotent: `npm view` returns non-zero for a version that does not
      # exist yet, which is the signal to publish. Any other failure still
      # fails the job.
      - name: Publish if this version is new
        id: publish
        if: env.NPM_TOKEN != ''
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice title=Already published::$NAME@$VERSION is already on npm; nothing to do."
          else
            # Prerelease versions (0.1.0-rc.1, …) go to the "rc" dist-tag so a
            # plain `npm install` never resolves to them; stable to "latest".
            case "$VERSION" in
              *-*) DIST_TAG=rc ;;
              *)   DIST_TAG=latest ;;
            esac
            echo "Publishing $NAME@$VERSION with dist-tag $DIST_TAG ..."
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and GitHub Release (by-product)
        if: steps.release-probe.outputs.new == 'true' && steps.publish.outcome == 'success'
        uses: johnhenry/workflows/.github/actions/create-release@v1
        with:
          version: ${{ steps.release-probe.outputs.version }}
