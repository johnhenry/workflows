name: npm-publish (reusable)

# Reusable `workflow_call` target implementing the @johnhenry family's
# single-package publish standard: "main is the release branch".
#
# The caller triggers it ONLY on `push: branches: [main]` (+
# `workflow_dispatch`) -- never `release:` or `push: tags:`. When the version
# in package.json is not on the npm registry yet, this workflow gates,
# publishes with provenance, and then -- as a by-product -- creates the git tag
# `v<version>` and a GitHub Release for it. When the version is already
# published it is a clean no-op (success, not failure).
#
# NOT for monorepos: this workflow publishes exactly one package.json in
# `working-directory`. Monorepos use changesets/action (see
# templates/publish-changesets.yml).
#
# Permissions (read this before wiring a caller): this job declares NO
# `permissions:` of its own, so it runs with whatever the CALLING job grants.
# The caller's job must declare
#   permissions:
#     contents: write   # tag + GitHub Release (since v1.1.0)
#     id-token: write   # npm provenance
# A caller that still grants only `contents: read` keeps publishing exactly as
# before; the tag/release step just skips with a warning (it never fails the
# run). See this repo's README.

# INVARIANT: this reusable workflow must NEVER declare a `concurrency:` block.
# Callers set `concurrency: { group: publish-${{ github.ref }},
# cancel-in-progress: false }`; the same group at two levels deadlocks the run
# before it starts (the ci.yml@v1 lesson). Also: npm trusted publishing trusts
# the CALLER's workflow filename, not this file's.

on:
  workflow_call:
    inputs:
      node-version:
        description: >-
          Node.js major version for install, gate, and publish steps. Must
          equal the caller repo's engines.node major (family floor: 26).
        required: false
        type: string
        default: "26"
      working-directory:
        description: >-
          Directory containing the package.json to publish. Single-package
          repos only -- leave as "." unless the publishable package lives
          in a subdirectory.
        required: false
        type: string
        default: "."
      install-command:
        description: >-
          Command to install dependencies before the gate runs. Use
          "npm ci" when a package-lock.json is committed (the default);
          use "npm install" for repos without a committed lockfile.
        required: false
        type: string
        default: "npm ci"
      node-cache:
        description: >-
          Value passed to actions/setup-node's `cache` input ("npm" by
          default). Set to an empty string for repos with no committed
          lockfile -- actions/setup-node errors if asked to cache npm
          without one.
        required: false
        type: string
        default: "npm"
      gate-commands:
        description: >-
          Newline-separated commands that must all succeed before
          publishing (build, typecheck, test, generated-artifact drift
          check, etc). Runs as a single bash script with -e/-o pipefail,
          so any failing line stops the job before publish runs.
        required: false
        type: string
        default: "npm test"
      create-release:
        description: >-
          After a successful publish, create the git tag v<version> and a
          GitHub Release for it. Needs the caller's job to grant
          `contents: write`; without it the step skips with a warning.
        required: false
        type: boolean
        default: true
      release-notes:
        description: >-
          "auto" (default) generates release notes from merged PRs
          (`gh release create --generate-notes`); "none" writes a one-line
          body linking the npm page.
        required: false
        type: string
        default: "auto"
      verify-timeout:
        description: >-
          Minutes to poll the registry for the just-published version
          (`npm view <name>@<version> version`) before failing the job. The
          tag/Release by-product is only created after verification passes.
        required: false
        type: string
        default: "10"
      verify-interval:
        description: Seconds between registry polls during verification.
        required: false
        type: string
        default: "20"
    secrets:
      NPM_TOKEN:
        description: >-
          npm token with publish rights for the target scope. Pass with
          `secrets: inherit` at the call site (simplest) or explicitly.
        required: true

    outputs:
      published:
        description: '"true" if this run published a new version to npm, otherwise "false".'
        value: ${{ jobs.publish.outputs.published }}
      version:
        description: The version in package.json at the commit that ran.
        value: ${{ jobs.publish.outputs.version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # No `permissions:` here on purpose: a reusable job that requests more than
    # its caller grants fails at startup, which would break every existing
    # caller that only grants `contents: read`. Inheriting the caller's token
    # lets those callers keep working (the tag/release step skips for them).
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
          cache: ${{ inputs.node-cache }}

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Gate
        run: ${{ inputs.gate-commands }}

      - name: Publish (idempotent)
        id: publish
        # Pre-flight `npm view` guard: ask the registry whether this exact
        # version exists; if so, skip cleanly instead of letting `npm publish`
        # fail on "cannot publish over the previously published version".
        # A skip is a SUCCESSFUL run (published=false), not a failure -- on the
        # push-to-main model most pushes do not change the version.
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice title=Already published::$PKG_NAME@$PKG_VERSION is already on npm; nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          npm publish --provenance --access public 2>&1 | tee "${RUNNER_TEMP:-/tmp}/npm-publish.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            # npm stages a publish before `npm view` can see it, so a queued
            # duplicate run passes the guard above and then 409s. That means
            # the version is (being) published by someone else: treat it as
            # already published (green, published=false) but flag conflict=true
            # so the verify + tag/release steps still run -- the first run may
            # have died before tagging. (Any real failure to land is caught by
            # verify-published.)
            if grep -qiE 'E409|previously staged|EPUBLISHCONFLICT|cannot publish over the previously published' "${RUNNER_TEMP:-/tmp}/npm-publish.log"; then
              echo "::notice title=Already published::$PKG_NAME@$PKG_VERSION was already published/staged (npm 409 conflict); treating as published and verifying."
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # E404 on PUT usually means the package NAME does not exist yet:
            # trusted publishing / provenance-only auth cannot create a package.
            # (capture first: `| grep -q` under pipefail can fail on SIGPIPE)
            NAME_LOOKUP=$(npm view "$PKG_NAME" name 2>&1 || true)
            if grep -q 'E404' "${RUNNER_TEMP:-/tmp}/npm-publish.log" && grep -q 'E404' <<<"$NAME_LOOKUP"; then
              echo "::error title=First publish of a new package name::$PKG_NAME does not exist on the npm registry yet, and npm trusted publishing cannot create a brand-new package name. Publish the first version once with a granular NPM_TOKEN that may create packages, or manually (npm publish --access public, with 2FA); then configure trusted publishing for the new package. See https://github.com/johnhenry/objectify/issues/9 and the 'Trusted publishing' section of the johnhenry/workflows README."
            fi
            exit "$STATUS"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the version reached the registry
        if: steps.publish.outputs.published == 'true' || steps.publish.outputs.conflict == 'true'
        # `npm publish` has exited green for versions the registry never
        # stored (aimatey-wrapper 0.2.0, objectify 0.0.2). Poll until it is
        # visible; fail the job (and skip the tag/Release below) if it is not.
        uses: johnhenry/workflows/.github/actions/verify-published@v1
        with:
          packages: ${{ steps.publish.outputs.name }}@${{ steps.publish.outputs.version }}
          timeout-minutes: ${{ inputs.verify-timeout }}
          interval-seconds: ${{ inputs.verify-interval }}

      - name: Tag and GitHub Release (by-product)
        if: (steps.publish.outputs.published == 'true' || steps.publish.outputs.conflict == 'true') && inputs.create-release
        # One implementation, shared with inline publish jobs. Never fails the
        # run for the expected cases: missing `contents: write` on the caller
        # (warning), tag already exists (notice), or a dispatch from a
        # non-default branch (notice). The package is already on npm by this
        # point, so these are by-products, not gates.
        uses: johnhenry/workflows/.github/actions/create-release@v1
        with:
          version: ${{ steps.publish.outputs.version }}
          notes: ${{ inputs.release-notes }}
          package-name: ${{ steps.publish.outputs.name }}
          working-directory: ${{ inputs.working-directory }}
