name: pypi-publish (reusable)

# Reusable `workflow_call` target implementing the family's PyPI publish
# standard: the same "main is the release branch" model as npm-publish.yml.
#
# The caller triggers it ONLY on `push: branches: [main]` (+
# `workflow_dispatch`) -- never `release:` or `push: tags:`. When the version
# in pyproject.toml is not on PyPI yet, this workflow gates, builds, publishes
# via PyPI trusted publishing (OIDC, no token), verifies the version appears on
# PyPI, and then -- as a by-product -- creates the git tag
# `<package-name>-v<version>` and a GitHub Release. When the version is already
# on PyPI it is a clean no-op (success, not failure).
#
# Permissions (the caller's job must declare them; this job declares none):
#   permissions:
#     contents: write   # tag + GitHub Release
#     id-token: write   # PyPI trusted publishing (OIDC)
#
# PyPI trusted publishing is keyed to the CALLER's workflow filename (PyPI
# validates the calling workflow, not this reusable file) plus the repository
# and optional environment. Register the publisher on pypi.org with the
# caller's filename and do not rename it later.
#
# INVARIANT: this reusable workflow must NEVER declare a `concurrency:` block
# (callers set `concurrency: { group: publish-pypi-${{ github.ref }},
# cancel-in-progress: false }`; the same group at two levels deadlocks).

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the pyproject.toml to publish.
        required: false
        type: string
        default: "."
      python-version:
        description: >-
          Python version for the gate and build. Must be 3.11+ (pyproject.toml
          is read with tomllib).
        required: false
        type: string
        default: "3.12"
      package-name:
        description: >-
          PyPI distribution name, and the tag prefix (the tag is
          `<package-name>-v<version>`). Defaults to `[project].name` from
          pyproject.toml.
        required: false
        type: string
        default: ""
      build-command:
        description: Command that builds the sdist + wheel into ./dist (relative to working-directory).
        required: false
        type: string
        default: "python -m build"
      gate-commands:
        description: >-
          Newline-separated commands that must all succeed before building
          (install test deps, run tests, etc). Runs in working-directory as one
          bash script with -e/-o pipefail. Skipped when the version is already
          on PyPI. Empty (default) means no gate.
        required: false
        type: string
        default: ""
      create-release:
        description: >-
          After a verified publish, create the tag `<package-name>-v<version>`
          and a GitHub Release. Needs the caller's job to grant
          `contents: write`; without it the step skips with a warning.
        required: false
        type: boolean
        default: true
      verify-timeout:
        description: Minutes to poll PyPI's JSON API for the just-published version before failing.
        required: false
        type: string
        default: "10"
      verify-interval:
        description: Seconds between PyPI polls during verification.
        required: false
        type: string
        default: "20"

    outputs:
      published:
        description: '"true" if this run published a new version to PyPI, otherwise "false".'
        value: ${{ jobs.publish.outputs.published }}
      version:
        description: The version in pyproject.toml at the commit that ran.
        value: ${{ jobs.publish.outputs.version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.exists == 'false' && 'true' || 'false' }}
      version: ${{ steps.meta.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Read name and version from pyproject.toml
        id: meta
        env:
          INPUT_NAME: ${{ inputs.package-name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f).get("project", {})
          version = project.get("version")
          if not version:
              sys.exit("::error title=No static version::pyproject.toml has no [project].version (dynamic versions are not supported by pypi-publish.yml)")
          name = os.environ.get("INPUT_NAME") or project.get("name")
          if not name:
              sys.exit("::error title=No package name::set the package-name input or [project].name in pyproject.toml")
          print(f"name={name}")
          print(f"version={version}")
          PY

      - name: Check whether this version is already on PyPI
        id: check
        env:
          PKG_NAME: ${{ steps.meta.outputs.name }}
          PKG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          URL="https://pypi.org/pypi/${PKG_NAME}/${PKG_VERSION}/json"
          CODE=000
          for attempt in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            case "$CODE" in 200|404) break ;; esac
            sleep $((attempt * 5))
          done
          case "$CODE" in
            200)
              echo "::notice title=Already published::$PKG_NAME $PKG_VERSION is already on PyPI; nothing to do."
              echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error title=PyPI lookup failed::$URL returned HTTP $CODE"
              exit 1 ;;
          esac

      - name: Gate
        if: steps.check.outputs.exists == 'false' && inputs.gate-commands != ''
        env:
          GATE_COMMANDS: ${{ inputs.gate-commands }}
        run: |
          set -eo pipefail
          bash -e -o pipefail -c "$GATE_COMMANDS"

      - name: Build
        if: steps.check.outputs.exists == 'false'
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          python -m pip install --upgrade build
          bash -e -o pipefail -c "$BUILD_COMMAND"
          ls -l dist

      - name: Publish to PyPI (trusted publishing)
        if: steps.check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ inputs.working-directory }}/dist
          skip-existing: true

      - name: Verify the version reached PyPI
        if: steps.check.outputs.exists == 'false'
        env:
          PKG_NAME: ${{ steps.meta.outputs.name }}
          PKG_VERSION: ${{ steps.meta.outputs.version }}
          TIMEOUT_MIN: ${{ inputs.verify-timeout }}
          INTERVAL: ${{ inputs.verify-interval }}
        run: |
          URL="https://pypi.org/pypi/${PKG_NAME}/${PKG_VERSION}/json"
          DEADLINE=$(( $(date +%s) + TIMEOUT_MIN * 60 ))
          while true; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "::notice title=Verified::$PKG_NAME $PKG_VERSION is visible on PyPI."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error title=Not on PyPI::$PKG_NAME $PKG_VERSION did not appear at $URL within ${TIMEOUT_MIN} minute(s) (last HTTP $CODE). The upload may have been dropped; re-run the workflow."
              exit 1
            fi
            echo "waiting for $PKG_NAME $PKG_VERSION on PyPI (HTTP $CODE)..."
            sleep "$INTERVAL"
          done

      - name: Tag and GitHub Release (by-product)
        if: steps.check.outputs.exists == 'false' && inputs.create-release
        uses: johnhenry/workflows/.github/actions/create-release@v1
        with:
          version: ${{ steps.meta.outputs.version }}
          tag-prefix: ${{ steps.meta.outputs.name }}-v
          notes: auto
          working-directory: ${{ inputs.working-directory }}
