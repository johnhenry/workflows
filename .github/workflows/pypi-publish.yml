name: pypi-publish (reusable, DEPRECATED)

# DEPRECATED -- do not use. PyPI trusted publishing validates the OIDC token's
# `job_workflow_ref` claim against the registered publisher's repository and
# workflow filename. When a caller in repo X uses a reusable workflow from
# johnhenry/workflows, `job_workflow_ref` is
# `johnhenry/workflows/.github/workflows/pypi-publish.yml@...` while
# `repository` is `johnhenry/X`, so PyPI always answers `invalid-publisher`
# (PyPI does not support reusable workflows from other repositories).
#
# Use the composite action instead; it runs inside the caller's own job:
#   steps:
#     - uses: actions/checkout@v4
#     - uses: johnhenry/workflows/.github/actions/pypi-publish@v1
#       with: { package-name: my-package }
# See templates/publish-pypi.yml and the README ("PyPI").
#
# This file is kept only so existing callers fail fast with a clear message
# instead of at the PyPI upload.

on:
  workflow_call:
    inputs:
      working-directory: { required: false, type: string, default: "." }
      python-version: { required: false, type: string, default: "3.12" }
      package-name: { required: false, type: string, default: "" }
      build-command: { required: false, type: string, default: "python -m build" }
      gate-commands: { required: false, type: string, default: "" }
      create-release: { required: false, type: boolean, default: true }
      verify-timeout: { required: false, type: string, default: "10" }
      verify-interval: { required: false, type: string, default: "20" }

jobs:
  deprecated:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error title=pypi-publish.yml is deprecated::PyPI trusted publishing rejects reusable workflows from other repositories (invalid-publisher). Replace this job with an inline job that runs actions/checkout and then uses: johnhenry/workflows/.github/actions/pypi-publish@v1 (see templates/publish-pypi.yml)."
          exit 1
